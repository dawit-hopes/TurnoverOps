[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turnoverops"
version = "0.1.0"
description = "Scheduling and turnover workflow API for short-term rental hosts."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "icalendar>=5.0",
    "apscheduler>=3.10,<4",
    "google-auth>=2.36",
    "requests>=2.32",
    "cryptography>=44.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["turnoverops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
